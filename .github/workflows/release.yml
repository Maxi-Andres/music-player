name: Release

# Publica un APK instalable en la pestaña Releases del repo.
#
# Para sacar una version nueva alcanza con etiquetar un commit:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# El APK sale firmado siempre con la misma clave, asi que quien ya tenga la app
# instalada la actualiza encima sin perder sus ajustes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publicar, con la v adelante (ej: v0.2.0)'
        required: true

# Necesario para crear el Release y subirle el APK.
permissions:
  contents: write

jobs:
  release:
    name: Compilar, firmar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      # v1.2.3 -> versionName 1.2.3 y versionCode 10203. El versionCode tiene que
      # crecer en cada version o Android rechaza la actualizacion; calcularlo del tag
      # lo hace automatico y sin numeros repetidos.
      # gradlew se versiona sin permiso de ejecucion (se edita desde Windows, que no
      # tiene ese bit). En el runner, que es Linux, ./gradlew cortaria con "Permission
      # denied" y codigo 126 antes de correr nada.
      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew

      - name: Calcular la version desde el tag
        id: version
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          NOMBRE="${TAG#v}"
          if ! [[ "$NOMBRE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "El tag '$TAG' no tiene la forma vMAYOR.MENOR.PARCHE (ej: v0.2.0)" >&2
            exit 1
          fi
          IFS='.' read -r MAYOR MENOR PARCHE <<< "$NOMBRE"
          echo "name=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "code=$((MAYOR * 10000 + MENOR * 100 + PARCHE))" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restaurar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secret KEYSTORE_BASE64: sin el, el APK saldria sin firmar." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar el APK firmado
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease --stacktrace

      # Se verifica antes de publicar: un APK sin firmar se baja igual y despues no
      # instala, y el error en el celular no dice por que.
      - name: Verificar que quedo firmado
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk \
             "music-player-${{ steps.version.outputs.name }}.apk"

      - name: Publicar el Release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOMBRE: ${{ steps.version.outputs.name }}
        run: |
          cat > "$RUNNER_TEMP/notas.md" <<NOTAS
          Bajá el \`.apk\` de acá abajo y abrilo en el celular para instalar.

          La primera vez Android va a pedir permiso para instalar apps de esta fuente.
          Si ya tenías una versión anterior de acá, se actualiza encima sin perder nada.

          Commits de esta versión: https://github.com/${{ github.repository }}/commits/$TAG
          NOTAS
          gh release create "$TAG" "music-player-$NOMBRE.apk" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notas.md"
