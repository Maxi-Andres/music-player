name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Si se pushea de nuevo sobre la misma rama, se cancela la corrida anterior.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rapido (~3 min): compila, lint y unit tests con cobertura.
  # Es el que corre siempre y el que bloquea el merge.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      # gradlew se versiona sin permiso de ejecucion (se edita desde Windows, que no
      # tiene ese bit). En el runner, que es Linux, ./gradlew cortaria con "Permission
      # denied" y codigo 126 antes de correr nada.
      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew

      - name: Lint de Android
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Cobertura (Kover) y verificacion de umbrales
        # koverVerify hace fallar el build si la cobertura baja del minimo
        # definido en build.gradle.kts. Es lo que evita que se agregue codigo sin test.
        run: ./gradlew :app:koverXmlReport :app:koverHtmlReport :app:koverVerify --stacktrace

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-unit-tests
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/kover/
          retention-days: 14

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Lento (~15 min): tests de UI de Compose sobre un emulador real.
  # Verifica lo que un unit test no puede: que las pantallas se dibujen y respondan.
  # ---------------------------------------------------------------------------
  instrumented-tests:
    name: Tests de UI (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No frena el merge si el emulador falla por flakiness de infraestructura.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      # gradlew se versiona sin permiso de ejecucion (se edita desde Windows, que no
      # tiene ese bit). En el runner, que es Linux, ./gradlew cortaria con "Permission
      # denied" y codigo 126 antes de correr nada.
      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew

      - name: Habilitar aceleracion KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Correr tests instrumentados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-instrumented-tests
          path: app/build/reports/androidTests/
          retention-days: 14
