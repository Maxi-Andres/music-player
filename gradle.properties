org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# El Kotlin integrado de AGP 9.4 es 2.2.10 y no puede leer la metadata 2.4 que traen
# las librerias de AndroidX actuales. Se desactiva para aplicar KGP 2.4.10 a mano.
# newDsl tambien va en false: el plugin kotlin-android no es compatible con el DSL nuevo.
android.builtInKotlin=false
android.newDsl=false
